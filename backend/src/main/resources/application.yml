spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${POSTGRES_DB:fastgondulas}
    username: ${POSTGRES_USER:fastgondulas}
    password: ${POSTGRES_PASSWORD:fastgondulas_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
      hibernate.type.preferred_enum_jdbc_type: OTHER
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:fastgondulas-super-secret-key-2026-must-be-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24h

  # Integrações externas
  integration:
    google-routes:
      api-key: ${GOOGLE_ROUTES_API_KEY:}
    openrouteservice:
      api-key: ${ORS_API_KEY:}
    tollguru:
      api-key: ${TOLLGURU_API_KEY:}

logging:
  level:
    com.fastgondulas: DEBUG
    org.springframework.security: WARN
